<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef5f0">
  <title>慢慢说 · 跟读练习</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">普通话跟读练习</p><h1>慢慢说</h1><p>听一句，慢慢跟着说。</p></header>
    <section class="practice" aria-labelledby="phrase">
      <p id="progress">正在准备短句</p>
      <h2 id="phrase">请稍等</h2>
      <p id="status" role="status" aria-live="polite">正在加载练习内容…</p>
      <p id="countdown" aria-hidden="true"></p>
      <p id="load-detail" class="note" hidden></p>
      <button id="start" type="button" disabled>开始练习</button>
      <button id="finished" type="button" hidden>我说完了</button>
      <button id="manual-start" type="button" class="secondary" hidden>不用麦克风，手动确认</button>
      <div class="controls">
        <button id="pause" type="button" class="secondary" disabled>暂停</button>
        <button id="replay" type="button" class="secondary" disabled>再听一次</button>
        <button id="next" type="button" class="secondary" disabled>下一句</button>
      </div>
    </section>
    <details id="selection">
      <summary>家属设置</summary>
      <label for="phrase-select">从哪句开始这一组</label><select id="phrase-select" disabled></select>
      <label for="repeats-select">每句示范次数</label><select id="repeats-select"><option value="1">1 遍</option><option value="2" selected>2 遍</option><option value="3">3 遍</option></select>
      <label for="silence-select">说话后，连续安静多久再继续</label><select id="silence-select"><option value="2">2 秒</option><option value="3" selected>3 秒</option><option value="5">5 秒</option><option value="8">8 秒</option></select>
      <button id="reset" type="button" class="secondary" disabled>回到第一句，重新开始</button>
      <p class="note">句中停顿较长时，请增加安静时间。背景人声或电视声音可能影响检测。</p>
    </details>
    <p id="save-status" class="note" role="status" aria-live="polite"></p>
    <p class="note">设置和进度只保存在当前浏览器中；清除浏览器数据或换手机后可能丢失。</p>
    <p class="note">示范结束后，用麦克风检测声音和安静时间，自动继续；也可点击“我说完了”。本组结束后停止。声音仅在本机分析，不录音、不上传、不评分。示范使用普通话合成演示音频。</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
